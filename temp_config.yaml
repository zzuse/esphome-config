ota:
  - platform: web_server
  - platform: esphome
    id: ota_state
    on_begin:
      - then:
          - logger.log:
              format: OTA Start
              args: []
              tag: main
              level: DEBUG
          - light.turn_on:
              id: display_backlight
              state: true
          - lambda: !lambda |-
              id(display_backlight).loop();
          - lvgl.resume: {}
          - lvgl.widget.redraw: {}
          - lvgl.label.update:
              id:
                - id: ota_label_primary
              text: Starting OTA...
          - lvgl.label.update:
              id:
                - id: ota_label_secondary
              text: Wait...
          - lvgl.widget.show:
              - id: ota_widget
          - lvgl.resume: {}
          - lvgl.widget.redraw: {}
          - lambda: !lambda |-
              id(lvgl_component).loop();
          - lambda: !lambda |-
              id(lvgl_component).loop();
          - logger.log:
              format: OTA widget shown
              args: []
              tag: main
              level: DEBUG
    on_progress:
      - then:
          - lvgl.bar.update:
              id:
                - id: ota_bar_value
              value: !lambda |-
                return (int)x;
              animated: LV_ANIM_ON
          - lvgl.label.update:
              id:
                - id: ota_label_primary
              text: ' '
          - lvgl.label.update:
              id:
                - id: ota_label_secondary
              text: !lambda |-
                static char buffer[64];
                snprintf(buffer, sizeof(buffer), "Firmware uploading %.1f%%", x);
                return buffer;
          - lambda: !lambda |-
              id(lvgl_component).loop();
    on_end:
      - then:
          - logger.log:
              format: OTA End
              args: []
              tag: main
              level: DEBUG
          - lvgl.bar.update:
              id:
                - id: ota_bar_value
              value: 100
              animated: LV_ANIM_ON
          - lvgl.label.update:
              id:
                - id: ota_label_primary
              text: Update complete
          - lvgl.label.update:
              id:
                - id: ota_label_secondary
              text: Rebooting...
          - lambda: !lambda |-
              id(lvgl_component).loop();
    on_error:
      - then:
          - logger.log:
              format: OTA update error %d
              args:
                - !lambda |-
                  x
              tag: main
              level: DEBUG
          - lvgl.label.update:
              id:
                - id: ota_label_primary
              text: Update ERROR
          - lvgl.label.update:
              id:
                - id: ota_label_secondary
              text: Rebooting...
          - lambda: !lambda |-
              id(lvgl_component).loop();
