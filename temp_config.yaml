  - id: time_update
    then:
      - lambda: !lambda |-
          // No operation
      - lambda: !lambda |-
          auto now = id(system_time).now();
          if (!now.is_valid()) return;
          // Day appended separately: %e space-pads and %d zero-pads, so
          // neither looks right for single-digit days (same trick as
          // clock-calendar.yaml).
          lv_label_set_text(id(weather_datetime),
              str_sprintf("%s %d  %02d:%02d", now.strftime("%a %b").c_str(),
                          now.day_of_month, now.hour, now.minute).c_str());
      - lambda: !lambda |-
          auto now = id(system_time).now();
          if (!now.is_valid()) return;

          // ---- Clock ----
          int hour12 = now.hour % 12;
          if (hour12 == 0) hour12 = 12;
          lv_label_set_text(id(clock_hours), str_sprintf("%d", hour12).c_str());
          lv_label_set_text(id(clock_minutes), str_sprintf("%02d", now.minute).c_str());
          lv_label_set_text(id(clock_ampm), now.hour < 12 ? "am" : "pm");
          // Day appended separately: %e space-pads and %d zero-pads, so both
          // look wrong for single-digit days.
          lv_label_set_text(id(clock_date),
              str_sprintf("%s %d", now.strftime("%A, %B").c_str(),
                          now.day_of_month).c_str());

          // ---- Calendar ----
          static const char *MONTHS[] = {
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December",
          };
          lv_label_set_text(id(calendar_title),
              str_sprintf("%s %d", MONTHS[now.month - 1], now.year).c_str());

          lv_obj_t *cells[42] = {
            id(cal_d0), id(cal_d1), id(cal_d2), id(cal_d3), id(cal_d4), id(cal_d5), id(cal_d6),
            id(cal_d7), id(cal_d8), id(cal_d9), id(cal_d10), id(cal_d11), id(cal_d12), id(cal_d13),
            id(cal_d14), id(cal_d15), id(cal_d16), id(cal_d17), id(cal_d18), id(cal_d19), id(cal_d20),
            id(cal_d21), id(cal_d22), id(cal_d23), id(cal_d24), id(cal_d25), id(cal_d26), id(cal_d27),
            id(cal_d28), id(cal_d29), id(cal_d30), id(cal_d31), id(cal_d32), id(cal_d33), id(cal_d34),
            id(cal_d35), id(cal_d36), id(cal_d37), id(cal_d38), id(cal_d39), id(cal_d40), id(cal_d41)
          };

          // day_of_week is 1=Sunday, so shift to 0=Sunday to match the columns.
          int today = now.day_of_month;
          int dow_today = now.day_of_week - 1;
          int first_dow = (((dow_today - (today - 1)) % 7) + 7) % 7;
          int ndays = days_in_month(now.month, now.year);

          for (int i = 0; i < 42; i++) {
            int day = i - first_dow + 1;
            if (day < 1 || day > ndays) {
              lv_label_set_text(cells[i], "");
              lv_obj_set_style_bg_opa(cells[i], LV_OPA_TRANSP, LV_PART_MAIN);
              continue;
            }
            lv_label_set_text(cells[i], str_sprintf("%d", day).c_str());
            bool is_today = (day == today);
            lv_obj_set_style_bg_opa(cells[i], is_today ? LV_OPA_COVER : LV_OPA_TRANSP,
                                    LV_PART_MAIN);
            lv_obj_set_style_text_color(cells[i],
                is_today ? lv_color_black() : lv_color_hex(0xF2F0EB), LV_PART_MAIN);
          }
      - lambda: !lambda |-
          auto now = id(system_time).now();
          if (!now.is_valid()) return;
          int hour12 = now.hour % 12;
          if (hour12 == 0) hour12 = 12;
          lv_label_set_text(id(photo_clock),
              str_sprintf("%d:%02d %s", hour12, now.minute,
                          now.hour < 12 ? "am" : "pm").c_str());
    mode: single
    parameters: {}
  - id: apply_brightness_mode
    then:
      - if:
          condition:
            lambda: !lambda |-
              return id(brightness_mode).current_option() == "Day";
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 0.4
                state: true
      - if:
          condition:
            lambda: !lambda |-
              return id(brightness_mode).current_option() == "Evening";
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 0.4
                state: true
      - if:
          condition:
            lambda: !lambda |-
              return id(brightness_mode).current_option() == "Night";
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 0.4
                state: true
    mode: single
    parameters: {}
  - id: set_brightness_mode_on_boot
    then:
      - if:
          condition:
            sun.is_above_horizon:
              elevation: -0.83333
          then:
            - logger.log:
                level: INFO
                format: 'Boot: Sun is up - Day mode'
                args: []
                tag: main
            - select.set:
                id: brightness_mode
                option: Day
          else:
            - if:
                condition:
                  lambda: !lambda |-
                    auto now = id(system_time).now();
                    int current = now.hour * 60 + now.minute;
                    int night = 0 * 60 + 0;
                    // Special case: if night_hour is midnight (0), use AM/PM as divider
                    // Evening = PM hours (12-23), Night = AM hours (0-11)
                    if (night == 0) {
                      return now.hour < 12;
                    }
                    // Otherwise: Night if past night_hour OR early morning (crossed midnight)
                    return current >= night || now.hour < 12;
                then:
                  - logger.log:
                      level: INFO
                      format: 'Boot: Night mode'
                      args: []
                      tag: main
                  - select.set:
                      id: brightness_mode
                      option: Night
                else:
                  - logger.log:
                      level: INFO
                      format: 'Boot: Evening mode'
                      args: []
                      tag: main
                  - select.set:
                      id: brightness_mode
                      option: Evening
    mode: single
    parameters: {}
  - id: photo_slideshow
    mode: restart
    then:
      - while:
          condition:
            lambda: !lambda |-
              return id(screensaver_active);
          then:
            - lvgl.page.show:
                id: photo_page
                animation: LV_SCREEN_LOAD_ANIM_FADE_IN
                time: 500ms
            - delay: 10s
            - if:
                condition:
                  lambda: !lambda |-
                    return id(screensaver_active);
                then:
                  - lvgl.page.show:
                      id: weather_page
                      animation: LV_SCREEN_LOAD_ANIM_FADE_IN
                      time: 500ms
                  - component.update:
                      id: kids_photo
                  - delay: 5s
    parameters: {}
  - id: update_battery_indicator
    then:
      - lambda: !lambda |-
          float v = id(battery_voltage).state;

          // Nothing on the BAT header: the divider reads near 0V and the panel
          // is running from USB. Show that rather than a fake 0%.
          if (isnan(v) || v < 2.5f) {
            lv_label_set_text(id(battery_icon), "󰚥");
            lv_label_set_text(id(battery_label), "USB");
            lv_obj_set_style_text_color(id(battery_icon), lv_color_hex(0x666666), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(battery_label), lv_color_hex(0x666666), LV_PART_MAIN);
            return;
          }

          // 1S LiPo resting-voltage -> state of charge. The cell curve is flat
          // through the middle, so a straight 3.3-4.2V map would read badly.
          static const float CURVE[][2] = {
            {3.30f, 0.0f},  {3.50f, 10.0f}, {3.60f, 20.0f}, {3.70f, 32.0f},
            {3.75f, 42.0f}, {3.85f, 55.0f}, {3.95f, 70.0f}, {4.05f, 85.0f},
            {4.20f, 100.0f},
          };
          const int LAST = (sizeof(CURVE) / sizeof(CURVE[0])) - 1;
          float pct;
          if (v <= CURVE[0][0]) {
            pct = 0.0f;
          } else if (v >= CURVE[LAST][0]) {
            pct = 100.0f;
          } else {
            pct = 0.0f;
            for (int i = 0; i < LAST; i++) {
              if (v >= CURVE[i][0] && v <= CURVE[i + 1][0]) {
                float span = CURVE[i + 1][0] - CURVE[i][0];
                pct = CURVE[i][1] + (v - CURVE[i][0]) / span * (CURVE[i + 1][1] - CURVE[i][1]);
                break;
              }
            }
          }
          id(battery_level).publish_state(pct);

          const char *glyph;
          if      (pct >= 95) glyph = "󰁹";
          else if (pct >= 85) glyph = "󰂂";
          else if (pct >= 75) glyph = "󰂁";
          else if (pct >= 65) glyph = "󰂀";
          else if (pct >= 55) glyph = "󰁿";
          else if (pct >= 45) glyph = "󰁾";
          else if (pct >= 35) glyph = "󰁽";
          else if (pct >= 25) glyph = "󰁼";
          else if (pct >= 15) glyph = "󰁻";
          else if (pct >= 5)  glyph = "󰁺";
          else                glyph = "󰂃";
          lv_label_set_text(id(battery_icon), glyph);

          char buf[8];
          snprintf(buf, sizeof(buf), "%d%%", (int) lroundf(pct));
          lv_label_set_text(id(battery_label), buf);

          lv_color_t c = (pct < 15)  ? lv_color_hex(0xFF0000)   // critical
                       : (pct < 30)  ? lv_color_hex(0xF37320)   // low
                                     : lv_color_hex(0x7ACF38);  // healthy
          lv_obj_set_style_text_color(id(battery_icon), c, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(battery_label), c, LV_PART_MAIN);
    mode: single
    parameters: {}
