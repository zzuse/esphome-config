    entity_id: light.athom_rgb_light_d93662_rgb_light_strip
    attribute: hs_color
    internal: true
    on_value:
      - then:
          - if:
              condition:
                lambda: !lambda |-
                  return !x.empty() && x != "None";
              then:
                - lambda: !lambda |-
                    std::string s = x;
                    size_t open  = s.find('(');
                    size_t comma = s.find(',');
                    size_t close = s.find(')');
                    size_t hstart = (open  != std::string::npos) ? open  + 1 : 0;
                    size_t cstart = (comma != std::string::npos) ? comma + 1 : 0;
                    if (comma != std::string::npos) {
                      id(button_5_current_hue) =
                          atof(s.substr(hstart, comma - hstart).c_str());
                      size_t clen = (close != std::string::npos)
                                      ? (close - cstart)
                                      : std::string::npos;
                      id(button_5_current_saturation) =
                          atof(s.substr(cstart, clen).c_str());
                      id(button_5_hs_color_valid) = true;
                    }
                - globals.set:
                    id: button_5_suspend_send
                    value: 'true'
                - lvgl.arc.update:
                    id:
                      - id: button_5_hue_arc
                    value: !lambda |-
                      return (int) id(button_5_current_hue);
                - lvgl.slider.update:
                    id:
                      - id: button_5_sat_slider
                    value: !lambda |-
                      return (int) id(button_5_current_saturation);
                    animated: LV_ANIM_ON
                - globals.set:
                    id: button_5_suspend_send
                    value: 'false'
                - script.execute:
                    id: button_5_update_bulb_color
              else:
                - globals.set:
                    id: button_5_hs_color_valid
                    value: 'false'
