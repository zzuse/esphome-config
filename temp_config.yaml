  - platform: homeassistant
    id: button_5_ha_rgb_color
    entity_id: light.athom_rgb_light_d93662_rgb_light_strip
    attribute: rgb_color
    internal: true
    on_value:
      - then:
          - if:
              condition:
                lambda: !lambda |-
                  // Only apply if hs_color isn't carrying real data right now.
                  return !x.empty() && x != "None" && !id(button_5_hs_color_valid);
              then:
                - lambda: !lambda |-
                    int r = 0, g = 0, b = 0;
                    // Tolerate both "(r, g, b)" and "r, g, b" formats.
                    int parsed = sscanf(x.c_str(), " ( %d , %d , %d )", &r, &g, &b);
                    if (parsed != 3) parsed = sscanf(x.c_str(), " %d , %d , %d", &r, &g, &b);
                    if (parsed == 3) {
                      float rf = r / 255.0f, gf = g / 255.0f, bf = b / 255.0f;
                      float mx = std::max({rf, gf, bf});
                      float mn = std::min({rf, gf, bf});
                      float d = mx - mn;
                      float h = 0.0f;
                      float s = (mx == 0.0f) ? 0.0f : (d / mx) * 100.0f;
                      if (d > 0.0001f) {
                        if      (mx == rf) h = 60.0f * fmod(((gf - bf) / d), 6.0f);
                        else if (mx == gf) h = 60.0f * (((bf - rf) / d) + 2.0f);
                        else               h = 60.0f * (((rf - gf) / d) + 4.0f);
                        if (h < 0) h += 360.0f;
                      }
                      id(button_5_current_hue) = h;
                      id(button_5_current_saturation) = s;
                      id(button_5_rgb_color_applied) = true;
                    } else {
                      id(button_5_rgb_color_applied) = false;
                    }
                - if:
                    condition:
                      lambda: !lambda |-
                        return id(button_5_rgb_color_applied);
                    then:
                      - globals.set:
                          id: button_5_suspend_send
                          value: 'true'
                      - lvgl.arc.update:
                          id:
                            - id: button_5_hue_arc
                          value: !lambda |-
                            return (int) id(button_5_current_hue);
                      - lvgl.slider.update:
                          id:
                            - id: button_5_sat_slider
                          value: !lambda |-
                            return (int) id(button_5_current_saturation);
                          animated: LV_ANIM_ON
                      - globals.set:
                          id: button_5_suspend_send
                          value: 'false'
                      - script.execute:
                          id: button_5_update_bulb_color
