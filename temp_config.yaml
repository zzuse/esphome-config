                    id:
                      - id: button_4_sat_slider
                    value: !lambda |-
                      return (int) id(button_4_current_saturation);
                    animated: LV_ANIM_ON
                - globals.set:
                    id: button_4_suspend_send
                    value: 'false'
                - script.execute:
                    id: button_4_update_bulb_color
              else:
                - globals.set:
                    id: button_4_hs_color_valid
