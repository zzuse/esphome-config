                  time: 300ms
        on_swipe_left:
          - then:
              - lambda: !lambda |-
                  lv_indev_wait_release(lv_indev_get_act());
              - logger.log:
                  format: Swipe left
                  args: []
                  tag: main
                  level: DEBUG
              - lvgl.page.previous:
                  animation: LV_SCREEN_LOAD_ANIM_OUT_LEFT
                  time: 300ms
        skip: false
    id: lvgl_component
    on_idle:
      - timeout: !lambda |-
          return (uint32_t)(id(display_backlight_timeout).state * 60000);
        then:
          - logger.log:
              level: INFO
              format: LVGL is idle
              args: []
              tag: main
          - if:
              condition:
                lambda: !lambda |-
                  return id(brightness_mode).current_option() == "Night" || false;
              then:
                - light.turn_off:
                    id: display_backlight
                    state: false
                - lvgl.pause:
                    show_snow: true
    on_resume:
      then:
        - logger.log:
            level: INFO
            format: LVGL resumed - restoring backlight
            args: []
            tag: main
        - script.execute:
            id: apply_brightness_mode
    rotation: 270
    buffer_size: 1.0
    update_interval: 1s
    displays: []
    color_depth: 16
    default_font: montserrat_14
    full_refresh: false
    update_when_display_idle: false
    draw_rounding: 2
    log_level: WARN
    transparency_key: \033[8m1024\033[28m
    touchscreens:
      - long_press_repeat_time: 100ms
        long_press_time: 400ms
    encoders: []
    keypads: []
    resume_on_input: true
    paused: false
    byte_order: little_endian
select:
  - platform: template
    name: Current Theme
    id: current_theme
    icon: mdi:theme-light-dark
    optimistic: true
    options:
      - Dark
      - Light
    initial_option: Dark
    on_value:
      - then:
          - if:
              condition:
                and:
                  - lambda: !lambda |-
                      return id(current_theme).current_option() == "Dark";
              then:
                - lvgl.style.update:
                    id: page_style
                    bg_color: black
                    text_color: white
                - lvgl.widget.redraw: {}
          - if:
              condition:
                and:
                  - lambda: !lambda |-
                      return id(current_theme).current_option() == "Light";
              then:
                - lvgl.style.update:
                    id: page_style
                    bg_color: white
                    text_color: black
                - lvgl.widget.redraw: {}
    disabled_by_default: false
    update_interval: 60s
  - platform: template
    name: Brightness mode
    id: brightness_mode
    icon: mdi:television-shimmer
    optimistic: true
    options:
      - Day
      - Evening
      - Night
    initial_option: Day
    on_value:
      - then:
          - lvgl.resume: {}
          - lvgl.widget.redraw: {}
          - script.execute:
              id: apply_brightness_mode
    disabled_by_default: false
    update_interval: 60s
