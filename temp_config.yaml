esphome:
  on_boot:
    - priority: 400.0
      then:
        - script.execute:
            id: update_loading_page
    - priority: -100.0
      then:
        - lambda: !lambda |-
            lv_obj_t *value = id(connected_ssid_label);
            lv_obj_t *grid = lv_obj_get_parent(value);
            uint32_t idx = lv_obj_get_index(value);
            lv_obj_add_flag(value, LV_OBJ_FLAG_HIDDEN);
            if (idx > 0) {
              lv_obj_add_flag(lv_obj_get_child(grid, idx - 1), LV_OBJ_FLAG_HIDDEN);
            }
    - priority: 400.0
      then:
        - script.execute:
            id: update_loading_page
    - priority: -100.0
      then:
        - number.set:
            id: display_backlight_timeout
            value: 720.0
  min_version: 2026.7.0
  project:
    name: Waveshare.ESP32-P4-WIFI6-Touch-LCD-10-1
    version: '1.0'
  name: waveshare-p4-lcd-10-1
  friendly_name: Waveshare ESP32-P4 WiFi6 Touch LCD 10.1
  comment: Waveshare esp32-p4-wifi6-touch-lcd-10.1 800px X 1280px Smart Screen
  build_path: build/waveshare-p4-lcd-10-1
  platformio_options: {}
  build_flags: []
  environment_variables: {}
  includes: []
  includes_c: []
  libraries: []
  name_add_mac_suffix: false
  merge_warnings: true
  debug_scheduler: false
  areas: []
  devices: []
esp32:
  board: esp32-p4-evboard
  variant: ESP32P4
  flash_size: 32MB
  cpu_frequency: 360MHZ
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true
      compiler_optimization: SIZE
      enable_lwip_assert: true
      ignore_efuse_custom_mac: false
      ignore_efuse_mac_crc: false
      sram1_as_iram: false
      enable_lwip_mdns_queries: true
      enable_lwip_bridge_interface: false
      enable_lwip_tcpip_core_locking: true
      enable_lwip_check_thread_safety: true
      disable_libc_locks_in_iram: true
      disable_vfs_support_termios: true
      disable_vfs_support_select: true
      disable_vfs_support_dir: true
      freertos_in_iram: false
      ringbuf_in_iram: false
      heap_in_iram: false
      loop_task_stack_size: 8192
      enable_ota_rollback: true
      enable_ota_downgrade_protection: false
      use_full_certificate_bundle: false
      include_builtin_idf_components: []
      enable_full_printf: false
      disable_debug_stubs: true
      disable_ocd_aware: true
      disable_usb_serial_jtag_secondary: true
      disable_dev_null_vfs: true
      disable_mbedtls_peer_cert: true
      disable_mbedtls_pkcs7: true
      disable_regi2c_in_iram: true
      adc_oneshot_in_iram: false
      disable_fatfs: true
    version: 5.5.4
    sdkconfig_options: {}
    log_level: ERROR
    components: []
  watchdog_timeout: 5s
lvgl:
