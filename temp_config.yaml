          - if:
              condition:
                lambda: !lambda |-
                  return !x.empty() && x != "None";
              then:
                - lambda: !lambda |-
                    std::string s = x;
                    size_t open  = s.find('(');
                    size_t comma = s.find(',');
                    size_t close = s.find(')');
                    size_t hstart = (open  != std::string::npos) ? open  + 1 : 0;
                    size_t cstart = (comma != std::string::npos) ? comma + 1 : 0;
                    if (comma != std::string::npos) {
                      id(button_4_current_hue) =
