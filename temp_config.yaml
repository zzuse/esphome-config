  - platform: online_image
    id: kids_photo
    url: http://10.0.0.30:8128/photo
    format: JPEG
    type: RGB565
    update_interval: 4294967295ms
    on_download_finished:
      - then:
          - lvgl.image.update:
              id:
                - id: photo_img
              src: kids_photo
    on_error:
      - then:
          - logger.log:
              level: WARN
              format: Kids photo download failed — is photo-server running?
              args: []
              tag: main
    transparency: opaque
    buffer_size: 65536
script:
  - id: popup_start_timeout
    mode: restart
    then:
      - delay: !lambda |-
          return id(popup_timeout_seconds) * 1000;
      - script.execute:
          id: popup_close
    parameters: {}
  - id: popup_force_close
    then:
      - script.execute:
          id: popup_close
    mode: single
    parameters: {}
  - id: popup_close
    then:
      - script.stop:
          id: popup_start_timeout
      - lvgl.widget.hide:
          - id: popup_scrim
      - lvgl.widget.hide:
          - id: button_4_popup
      - lvgl.widget.hide:
          - id: button_5_popup
    mode: single
    parameters: {}
  - id: update_loading_page
    then:
      - lvgl.label.update:
          id:
            - id: boot_synchronization_label
          text: Synchronizing data...
      - lvgl.label.update:
          id:
            - id: boot_homeassistant_label
          text: Connecting to Home Assistant..
    mode: single
    parameters: {}
  - id: check_boot_status
    then:
      - lambda: !lambda |-
          if (id(ha_connected)) {
            lv_obj_add_flag(id(boot_homeassistant), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(boot_synchronization), LV_OBJ_FLAG_HIDDEN);
            id(start_sync_animation).execute();
          }
    mode: single
    parameters: {}
  - id: start_sync_animation
    then:
      - lvgl.page.show:
          id: main_page
          animation: LV_SCREEN_LOAD_ANIM_NONE
          time: 50ms
      - delay: 1s
      - lvgl.bar.update:
          id:
            - id: boot_synchronization_bar
          value: 50
          animated: LV_ANIM_ON
      - delay: 1s
      - lvgl.bar.update:
          id:
            - id: boot_synchronization_bar
          value: 100
          animated: LV_ANIM_ON
      - delay: 500ms
      - lvgl.widget.hide:
          - id: loading_page
    mode: single
    parameters: {}
  - id: on_ha_connected
    then:
      - lambda: !lambda |-
          if (!id(ha_connected)) {
            id(ha_connected) = true;
            lv_label_set_text(id(boot_homeassistant_label), "Home Assistant Connected!");
            lv_obj_add_flag(id(boot_homeassistant_spiner), LV_OBJ_FLAG_HIDDEN);
            id(check_boot_status).execute();
          }
    mode: single
    parameters: {}
  - id: fetch_weather_forecast
    then:
      - logger.log:
          level: INFO
          format: Requesting weather forecast from Home Assistant...
          args: []
          tag: main
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            type: daily
            entity_id: weather.forecast_home
          capture_response: true
          response_template: "{% set forecasts = response[\"weather.forecast_home\"\
            ].forecast %} {% set result = {\n  'condition_0': forecasts[0].condition\
            \ | default('unknown'),\n  'temp_hi_0': forecasts[0].temperature | default(0)\
            \ | string,\n  'temp_lo_0': forecasts[0].templow | default(0) | string,\n\
            \  'day_0': as_timestamp(forecasts[0].datetime) | timestamp_custom('%a'),\n\
            \  'condition_1': forecasts[1].condition | default('unknown'),\n  'temp_hi_1':\
            \ forecasts[1].temperature | default(0) | string,\n  'temp_lo_1': forecasts[1].templow\
            \ | default(0) | string,\n  'day_1': as_timestamp(forecasts[1].datetime)\
            \ | timestamp_custom('%a'),\n  'condition_2': forecasts[2].condition |\
            \ default('unknown'),\n  'temp_hi_2': forecasts[2].temperature | default(0)\
            \ | string,\n  'temp_lo_2': forecasts[2].templow | default(0) | string,\n\
            \  'day_2': as_timestamp(forecasts[2].datetime) | timestamp_custom('%a'),\n\
            \  'condition_3': forecasts[3].condition | default('unknown'),\n  'temp_hi_3':\
            \ forecasts[3].temperature | default(0) | string,\n  'temp_lo_3': forecasts[3].templow\
            \ | default(0) | string,\n  'day_3': as_timestamp(forecasts[3].datetime)\
            \ | timestamp_custom('%a')\n} %} {{ result | tojson }}"
          on_success:
            then:
              - lambda: !lambda |-
                  auto data = response["response"];

                  // Store conditions in globals for icon updates
                  id(forecast_condition_0) = data["condition_0"].as<std::string>();
                  id(forecast_condition_1) = data["condition_1"].as<std::string>();
                  id(forecast_condition_2) = data["condition_2"].as<std::string>();
                  id(forecast_condition_3) = data["condition_3"].as<std::string>();

                  ESP_LOGI("weather", "Day 0: %s, Hi: %s, Lo: %s",
                      data["day_0"].as<std::string>().c_str(),
                      data["temp_hi_0"].as<std::string>().c_str(),
                      data["temp_lo_0"].as<std::string>().c_str());
              - lvgl.label.update:
                  id:
                    - id: forecast_day_0
                  text: !lambda |-
                    return response["response"]["day_0"].as<std::string>();
              - lvgl.label.update:
                  id:
                    - id: forecast_temperature_hi_0
                  text: !lambda |-
                    return response["response"]["temp_hi_0"].as<std::string>() + "°";
              - lvgl.label.update:
                  id:
                    - id: forecast_temperature_lo_0
                  text: !lambda |-
                    return response["response"]["temp_lo_0"].as<std::string>() + "°";
              - script.execute:
                  id: update_forecast_icon_0
              - lvgl.label.update:
                  id:
                    - id: forecast_day_1
                  text: !lambda |-
                    return response["response"]["day_1"].as<std::string>();
              - lvgl.label.update:
                  id:
                    - id: forecast_temperature_hi_1
                  text: !lambda |-
                    return response["response"]["temp_hi_1"].as<std::string>() + "°";
              - lvgl.label.update:
                  id:
                    - id: forecast_temperature_lo_1
                  text: !lambda |-
                    return response["response"]["temp_lo_1"].as<std::string>() + "°";
              - script.execute:
                  id: update_forecast_icon_1
              - lvgl.label.update:
                  id:
                    - id: forecast_day_2
                  text: !lambda |-
                    return response["response"]["day_2"].as<std::string>();
              - lvgl.label.update:
                  id:
                    - id: forecast_temperature_hi_2
