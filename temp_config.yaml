  - id: button_4_picker_update
    then:
      - lambda: !lambda |-
          lv_color_t c;
          char buf[32];
          if (id(button_4_mode_kelvin)) {
            float t = id(button_4_current_color_temp) / 100.0f;
            float r, g, b;
            if (t <= 66.0f) {
              r = 255.0f;
              g = 99.4708025861f * logf(t) - 161.1195681661f;
              b = (t <= 19.0f)
                    ? 0.0f
                    : 138.5177312231f * logf(t - 10.0f) - 305.0447927307f;
            } else {
              r = 329.698727446f * powf(t - 60.0f, -0.1332047592f);
              g = 288.1221695283f * powf(t - 60.0f, -0.0755148492f);
              b = 255.0f;
            }
            auto cl = [](float v) -> uint8_t {
              return (uint8_t)(v < 0 ? 0 : (v > 255 ? 255 : v));
            };
            c = lv_color_make(cl(r), cl(g), cl(b));
            snprintf(buf, sizeof(buf), "%dK",
                     (int) id(button_4_current_color_temp));
          } else {
            uint16_t h = (uint16_t) id(button_4_current_hue);
            uint8_t  s = (uint8_t)  id(button_4_current_saturation);
            c = lv_color_hsv_to_rgb(h, s, 100);
            snprintf(buf, sizeof(buf), "H:%u  S:%u", h, s);
          }
          lv_obj_set_style_text_color(id(button_4_bulb_icon), c, LV_PART_MAIN);
          lv_obj_set_style_shadow_color(id(button_4_bulb_container), c, LV_PART_MAIN);
