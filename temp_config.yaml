  - platform: homeassistant
    id: button_4_ha_rgb_color
    entity_id: light.athom_rgb_light_d93662_rgb_light_strip
    attribute: rgb_color
    internal: true
    on_value:
      - then:
          - if:
              condition:
                lambda: !lambda |-
                  // Only apply if hs_color isn't carrying real data right now.
                  return !x.empty() && x != "None" && !id(button_4_hs_color_valid);
              then:
                - lambda: !lambda |-
                    int r = 0, g = 0, b = 0;
                    // Tolerate both "(r, g, b)" and "r, g, b" formats.
                    int parsed = sscanf(x.c_str(), " ( %d , %d , %d )", &r, &g, &b);
                    if (parsed != 3) parsed = sscanf(x.c_str(), " %d , %d , %d", &r, &g, &b);
                    if (parsed == 3) {
                      float rf = r / 255.0f, gf = g / 255.0f, bf = b / 255.0f;
                      float mx = std::max({rf, gf, bf});
                      float mn = std::min({rf, gf, bf});
                      float d = mx - mn;
                      float h = 0.0f;
                      float s = (mx == 0.0f) ? 0.0f : (d / mx) * 100.0f;
                      if (d > 0.0001f) {
                        if      (mx == rf) h = 60.0f * fmod(((gf - bf) / d), 6.0f);
                        else if (mx == gf) h = 60.0f * (((bf - rf) / d) + 2.0f);
                        else               h = 60.0f * (((rf - gf) / d) + 4.0f);
                        if (h < 0) h += 360.0f;
                      }
                      id(button_4_current_hue) = h;
                      id(button_4_current_saturation) = s;
                      id(button_4_rgb_color_applied) = true;
                    } else {
                      id(button_4_rgb_color_applied) = false;
                    }
                - if:
                    condition:
                      lambda: !lambda |-
                        return id(button_4_rgb_color_applied);
                    then:
                      - globals.set:
                          id: button_4_suspend_send
                          value: 'true'
                      - lvgl.arc.update:
                          id:
                            - id: button_4_hue_arc
                          value: !lambda |-
                            return (int) id(button_4_current_hue);
                      - lvgl.slider.update:
                          id:
                            - id: button_4_sat_slider
                          value: !lambda |-
                            return (int) id(button_4_current_saturation);
                          animated: LV_ANIM_ON
                      - globals.set:
                          id: button_4_suspend_send
                          value: 'false'
                      - script.execute:
                          id: button_4_update_bulb_color
    disabled_by_default: false
    name: button_4_ha_rgb_color
  - platform: homeassistant
    id: button_4_ha_supported_modes
    entity_id: light.athom_rgb_light_d93662_rgb_light_strip
    attribute: supported_color_modes
    internal: true
    on_value:
      - then:
          - lambda: !lambda |-
              // HA supported_color_modes values:
              //   onoff, brightness, color_temp, hs, rgb, rgbw, rgbww, xy, white
              bool has_rgbww = x.find("rgbww") != std::string::npos;
              bool has_rgbw  = x.find("rgbw")  != std::string::npos;
              bool has_rgb   = x.find("rgb")   != std::string::npos;  // matches rgb/rgbw/rgbww
              bool has_hs    = x.find("hs")    != std::string::npos;
              bool has_xy    = x.find("xy")    != std::string::npos;
              bool has_ct    = x.find("color_temp") != std::string::npos;
