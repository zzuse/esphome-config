# Shared UI/config included by both my-panel.yaml (real hardware) and sim.yaml (SDL
# simulator). Both device files now use the same 6x10 grid, so all five buttons live here;
# device-specific bits (esphome:, logger:, wifi/ota/backlight, hardware:, and the lvgl grid
# layout itself) stay in each device file.
#
# NOTE: substitutions are intentionally NOT shared here. Several packages included below
# (and by the device files, e.g. backlight_time.yaml) define their own default substitutions
# with the same names (display_backlight_timeout_initial, icon_font, etc). ESPHome gives a
# file's own top-level substitutions precedence over any package it pulls in, but packages
# are merged against each other in declaration order — so a substitution declared here would
# be just another package and could silently lose to a later-declared package's default
# (this happened with display_backlight_timeout_initial: it fell back to backlight_time.yaml's
# ".12" default instead of the intended "5"). Keep substitutions in each device file's own
# top-level `substitutions:` block instead.

# The info page (pages/info.yaml, in the submodule) ships a "Connected SSID"
# row we don't want. Its value label has an id, but the caption next to it
# doesn't, so there's nothing to override from here — and patching the
# submodule would break `git submodule update`. Instead, hide the value label
# and its caption (the immediately preceding widget in the same grid) once the
# UI exists. Both cells are in grid row 5, which is `content`-sized, so the row
# collapses when its only two children are hidden.
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            lv_obj_t *value = id(connected_ssid_label);
            lv_obj_t *grid = lv_obj_get_parent(value);
            uint32_t idx = lv_obj_get_index(value);
            lv_obj_add_flag(value, LV_OBJ_FLAG_HIDDEN);
            if (idx > 0) {
              lv_obj_add_flag(lv_obj_get_child(grid, idx - 1), LV_OBJ_FLAG_HIDDEN);
            }

# Time update script - This is run once per second. Use it to update any time related labels.
script:
  # --------------------------------------------------------------------------
  # This script is called once per minute.
  # Any packages in this library will !extend time_update to update their own labels.
  # You can add code here to update your own custom labels.
  # --------------------------------------------------------------------------
  - id: time_update
    then:
      - lambda: |-
          // No operation

packages:
  # Styles + Themes + Some nice basic fonts + 1000s of glyphs + all the colors
  theme: !include esphome-modular-lvgl-buttons/common/theme/index.yaml
  # theme:  !include esphome-modular-lvgl-buttons/common/theme/index_debug.yaml  # uncomment to enable debug outlines

  # Popup system — code for popup pages lives here, but the popups themselves are defined in the UI section below
  popup_system: !include esphome-modular-lvgl-buttons/ui/popup/popup_system.yaml

  # Basic boot screen with ESPHome logo and device diagnostic info
  loading_screen: !include esphome-modular-lvgl-buttons/pages/loading.yaml
  # info screen - WiFi login, IP address, MAC address etc
  info_screen: !include esphome-modular-lvgl-buttons/pages/info.yaml

  # Dedicated full-screen weather page (weather.forecast_home) — swipe to reach it
  weather_page: !include weather-page.yaml

  # This section will add buttons and page to your screen using the ESPHome package system.
  # Each package has all the code required for the button or page (LVGL, sensors, etc)

  # Add a button the controls a light in HA
  button_1: !include
    file: esphome-modular-lvgl-buttons/ui/switch/remote.yaml
    vars:
      uid: button_1
      row: 0
      column: 0
      text: Light
      icon: $mdi_lightbulb
      entity_id: "switch.athom_smart_plug_v3_50ebc0_switch"

  # Big colourful clock + one-month calendar, filling the right-hand block of
  # the main grid. Replaces the old small time button (ui/clock/time_button.yaml).
  clock_calendar: !include clock-calendar.yaml

  # Add a button that goes to a different page
  button_3: !include
    file: esphome-modular-lvgl-buttons/ui/page/page_button.yaml
    vars:
      uid: button_3
      row: 1
      column: 0
      text: Info screen
      icon: $mdi_information_box
      click_page: info_screen

  # Add a light
  button_4: !include
    file: esphome-modular-lvgl-buttons/ui/light/remote.yaml
    vars:
      uid: button_4
      row: 2
      column: 0
      row_span: 2
      text: RGB light
      icon: $mdi_string_lights
      entity_id: light.athom_rgb_light_d93662_rgb_light_strip

  # Add a light
  button_5: !include
    file: esphome-modular-lvgl-buttons/ui/light/remote.yaml
    vars:
      uid: button_5
      row: 2
      column: 1
      row_span: 2
      text: RGB light 2
      icon: $mdi_string_lights
      entity_id: light.athom_rgb_light_d93662_rgb_light_strip

