---
# Substitution variables used through the codebase
substitutions:
  icon_font: mdi_icons_40
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  button_text_color: "white"

  # LCD back light modes - Code in backlight_time.yaml
  # Flat 40% around the clock: no sunrise ramp to full, no dimming at night,
  # and the screen never blanks on idle.
  display_daytime_brightness: "40%"
  display_nighttime_brightness: "40%"
  display_night_hour: "0"      # Hour for night mode (0-23)
  display_night_minute: "0"    # Minute for night mode (0-59)
  display_backlight_timeout_always_enabled: "false"  # Set true to dim/off in all modes, not just Night
  display_backlight_timeout_initial: "720"  # Idle blank timeout in minutes (720 = max, effectively never)

  # defaults for popup pages
  popup_timeout_seconds: '120'  # timeout in seconds

  # Kids-photo screensaver: server URL and timings are set in photo-page.yaml.

esphome:
  name: "waveshare-p4-lcd-10-1"
  friendly_name: "Waveshare ESP32-P4 WiFi6 Touch LCD 10.1"
  comment: "Waveshare esp32-p4-wifi6-touch-lcd-10.1 800px X 1280px Smart Screen"
  on_boot:
    - priority: 400
      then:
        - script.execute: update_loading_page
    # display_backlight_timeout is `restore_value: true`, so a previously stored
    # 5 would survive this config change and still blank the screen at night.
    # Pin it on every boot. Remove this block if you want the HA number entity
    # to be authoritative again.
    - priority: -100
      then:
        - number.set:
            id: display_backlight_timeout
            value: 720

logger:
  level: debug
  logs:
    lvgl: info
  hardware_uart: UART0

packages:
  # Shared time_update script, theme/popup/loading/info includes, buttons 1-5,
  # and fonts — see ui-shared.yaml
  shared_ui: !include ui-shared.yaml

  # Generic configuration for ESP32 screens
  # Include Wi-Fi support
  wifi: !include esphome-modular-lvgl-buttons/common/wifi.yaml
  # Enable OTA updates with a status screen
  ota_screen: !include esphome-modular-lvgl-buttons/common/ota.yaml
  # Some basic sensors
  sensors: !include esphome-modular-lvgl-buttons/common/sensors_base.yaml
  # Include if your touch screen has a backlight. Also sets the time from HA
  backlight: !include esphome-modular-lvgl-buttons/common/backlight_time.yaml

  # Kids-photo screensaver page (shows up on idle, tap to dismiss)
  photo_page: !include photo-page.yaml

  # Hardware description file for 10.1" display
  hardware: !include
    file: esphome-modular-lvgl-buttons/hardware/waveshare-esp32-p4-wifi6-touch-lcd-10.1.yaml
    vars:
      rotation: "270"  # set screen rotation 0, 90, 180, 270
  # Media Player and Voice Assistant
  # media_voice: !include esphome-modular-lvgl-buttons/hardware/media_player-voice_assistant.yaml


# This is the main LVGL section. We start with a simple grid.
lvgl:
  buffer_size: 100%
  pages:
    - id: main_page
      layout: 6x10
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml
      widgets:
        # You can use the package section above to add prebuilt button types or build your own custom button from scratch here.
        - container:
            id: button_12
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            grid_cell_row_pos: 5
            grid_cell_column_pos: 9
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            outline_width: 1   # debug code - This is for visualizing boundaries remove for production
            outline_color: red  # debug code - This is for visualizing boundaries remove for production
            widgets:
              - label:
                  text_font: $text_font
                  align: center
                  text_color: white
                  text: "Cell 5,9"
        # Speaker volume bar (vertical), icon at the bottom
        - container:
            id: volume_tile
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            grid_cell_row_pos: 4
            grid_cell_column_pos: 0
            grid_cell_row_span: 2
            grid_cell_column_span: 1
            widgets:
              - slider:
                  id: volume_slider
                  align: top_mid
                  y: 10
                  width: 20
                  height: 72%
                  min_value: 0
                  max_value: 100
                  value: 50
                  radius: 10
                  knob:
                    bg_color: $label_on_color
                  indicator:
                    radius: 10
                    bg_color: $button_on_color
                  on_release:
                    - media_player.volume_set:
                        id: panel_media
                        volume: !lambda return x / 100.0f;
              - label:
                  id: volume_icon
                  text_font: $icon_font
                  align: bottom_mid
                  y: -5
                  text_color: $icon_on_color
                  text: $mdi_volume_high
        # Battery indicator, top-right status corner
        - container:
            id: battery_tile
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            grid_cell_row_pos: 0
            grid_cell_column_pos: 9
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            widgets:
              - label:
                  id: battery_icon
                  text_font: $icon_font
                  align: center
                  y: -12
                  text_color: $icon_off_color
                  text: $mdi_battery_outline
              - label:
                  id: battery_label
                  text_font: $text_font
                  align: center
                  y: 22
                  text_color: $label_off_color
                  text: "--"

        # Display backlight brightness bar (vertical), icon at the bottom
        - container:
            id: brightness_tile
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            grid_cell_row_pos: 4
            grid_cell_column_pos: 1
            grid_cell_row_span: 2
            grid_cell_column_span: 1
            widgets:
              - slider:
                  id: brightness_slider
                  align: top_mid
                  y: 10
                  width: 20
                  height: 72%
                  min_value: 5    # floor so the screen can't be slid fully dark
                  max_value: 100
                  value: 100
                  radius: 10
                  knob:
                    bg_color: $label_on_color
                  indicator:
                    radius: 10
                    bg_color: $button_on_color
                  on_release:
                    - light.turn_on:
                        id: display_backlight
                        brightness: !lambda return x / 100.0f;
              - label:
                  id: brightness_icon
                  text_font: $icon_font
                  align: bottom_mid
                  y: -5
                  text_color: $icon_on_color
                  text: $mdi_brightness_6

# Keep the on-screen brightness slider in sync with the backlight
# (also covers changes made from HA and the day/night backlight scripts)
light:
  - id: !extend display_backlight
    on_state:
      - lvgl.slider.update:
          id: brightness_slider
          value: !lambda |-
            auto vals = id(display_backlight).remote_values;
            return vals.is_on() ? vals.get_brightness() * 100.0f : 0.0f;

# Battery monitoring.
# The board's BAT header (J13) feeds a 200K/100K divider into GPIO20 — see the
# ESP32-P4-WIFI6-Touch-LCD-X schematic, "POWER" sheet (R92/R93, filtered by
# C190). GPIO20 is ADC1 channel 4 on the P4. The divider means the pin sees
# VBAT/3, so 4.2V (full 1S LiPo) reads 1.4V — comfortably inside the 12db range.
# Charging is handled by the ETA6003Q; its STAT pin drives the onboard LED only
# and is not wired to a GPIO, so charge state can't be read in software.
sensor:
  - platform: adc
    pin: GPIO20
    id: battery_voltage
    name: "Battery Voltage"
    entity_category: diagnostic
    attenuation: 12db
    update_interval: 60s
    accuracy_decimals: 2
    unit_of_measurement: "V"
    device_class: voltage
    filters:
      # Undo the on-board 200K/100K divider, then smooth out ADC noise.
      - multiply: 3.0
      - median:
          window_size: 5
          send_every: 5
    on_value:
      - script.execute: update_battery_indicator

  - platform: template
    id: battery_level
    name: "Battery Level"
    entity_category: diagnostic
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: never

script:
  - id: update_battery_indicator
    then:
      - lambda: |-
          float v = id(battery_voltage).state;

          // Nothing on the BAT header: the divider reads near 0V and the panel
          // is running from USB. Show that rather than a fake 0%.
          if (isnan(v) || v < 2.5f) {
            lv_label_set_text(id(battery_icon), "$mdi_power_plug");
            lv_label_set_text(id(battery_label), "USB");
            lv_obj_set_style_text_color(id(battery_icon), lv_color_hex(0x666666), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(battery_label), lv_color_hex(0x666666), LV_PART_MAIN);
            return;
          }

          // 1S LiPo resting-voltage -> state of charge. The cell curve is flat
          // through the middle, so a straight 3.3-4.2V map would read badly.
          static const float CURVE[][2] = {
            {3.30f, 0.0f},  {3.50f, 10.0f}, {3.60f, 20.0f}, {3.70f, 32.0f},
            {3.75f, 42.0f}, {3.85f, 55.0f}, {3.95f, 70.0f}, {4.05f, 85.0f},
            {4.20f, 100.0f},
          };
          const int LAST = (sizeof(CURVE) / sizeof(CURVE[0])) - 1;
          float pct;
          if (v <= CURVE[0][0]) {
            pct = 0.0f;
          } else if (v >= CURVE[LAST][0]) {
            pct = 100.0f;
          } else {
            pct = 0.0f;
            for (int i = 0; i < LAST; i++) {
              if (v >= CURVE[i][0] && v <= CURVE[i + 1][0]) {
                float span = CURVE[i + 1][0] - CURVE[i][0];
                pct = CURVE[i][1] + (v - CURVE[i][0]) / span * (CURVE[i + 1][1] - CURVE[i][1]);
                break;
              }
            }
          }
          id(battery_level).publish_state(pct);

          const char *glyph;
          if      (pct >= 95) glyph = "$mdi_battery";
          else if (pct >= 85) glyph = "$mdi_battery_90";
          else if (pct >= 75) glyph = "$mdi_battery_80";
          else if (pct >= 65) glyph = "$mdi_battery_70";
          else if (pct >= 55) glyph = "$mdi_battery_60";
          else if (pct >= 45) glyph = "$mdi_battery_50";
          else if (pct >= 35) glyph = "$mdi_battery_40";
          else if (pct >= 25) glyph = "$mdi_battery_30";
          else if (pct >= 15) glyph = "$mdi_battery_20";
          else if (pct >= 5)  glyph = "$mdi_battery_10";
          else                glyph = "$mdi_battery_alert";
          lv_label_set_text(id(battery_icon), glyph);

          char buf[8];
          snprintf(buf, sizeof(buf), "%d%%", (int) lroundf(pct));
          lv_label_set_text(id(battery_label), buf);

          lv_color_t c = (pct < 15)  ? lv_color_hex(0xFF0000)   // critical
                       : (pct < 30)  ? lv_color_hex(0xF37320)   // low
                                     : lv_color_hex(0x7ACF38);  // healthy
          lv_obj_set_style_text_color(id(battery_icon), c, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(battery_label), c, LV_PART_MAIN);

micro_wake_word:
  id: mww
  models:
    - model: hey_jarvis     # or hey_jarvis, hey_mycroft
  microphone: my_microphone     # ← match the id from the hardware file
  on_wake_word_detected:
    - voice_assistant.start:

media_player:
  - platform: speaker
    id: panel_media
    name: Panel Speaker
    # ES8311 DAC: below ~50% is inaudible, above ~95% clips.
    # Map the 0-100% volume scale into the clean range.
    volume_min: 0.5
    volume_max: 0.9
    # Feed the resampler → mixer → my_speaker chain from the hardware file.
    # Writing to my_speaker directly conflicts with the mixer and garbles audio.
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    on_state:
      # Keep the on-screen volume slider in sync (also covers changes made from HA)
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda return id(panel_media).volume * 100.0f;
    on_announcement:
      # Mic and speaker share one I2S bus at different sample rates —
      # the mic must be released before the speaker starts.
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop:
            - voice_assistant.stop:
            - wait_until:
                condition:
                  not:
                    microphone.is_capturing:
                timeout: 2s

voice_assistant:
  id: va
  microphone: my_microphone     # ← same id
  media_player: panel_media
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_end:
    # Give the TTS announcement time to be queued and start playing
    - delay: 1s
    # Don't restart the mic (shared I2S bus) until playback has finished
    - wait_until:
        condition:
          and:
            - not:
                media_player.is_announcing:
                  id: panel_media
            - not:
                media_player.is_playing:
                  id: panel_media
        timeout: 30s
    # Brief pause to let the speaker fully release the I2S bus
    - delay: 300ms
    - micro_wake_word.start:
  on_error:
    - micro_wake_word.start:

api:
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop: