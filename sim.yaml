---
# Substitution variables used through the codebase

substitutions:
  icon_font: mdi_icons_40
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  button_text_color: "white"

  # LCD back light modes - Code in backlight_time.yaml
  display_daytime_brightness: "100%"
  display_nighttime_brightness: "50%"
  display_night_hour: "0"      # Hour for night mode (0-23)
  display_night_minute: "0"    # Minute for night mode (0-59)
  display_backlight_timeout_always_enabled: "false"  # Set true to dim/off in all modes, not just Night
  display_backlight_timeout_initial: "5"  # Initial backlight timeout in minutes (-1 to disable)

  # Screen Size — landscape, matching my-panel.yaml's rotated (270°) 10.1" display
  screen_height: '800'
  screen_width: '1280'

  # defaults for popup pages
  popup_timeout_seconds: '120'  # timeout in seconds

esphome:
  name: sdl-800px-test
  friendly_name: SDL 800px-test
  on_boot:
    - priority: 400
      then:
        - script.execute: update_loading_page

logger:
  level: debug

packages:
  # Shared time_update script, theme/popup/loading/info includes, buttons 1-5,
  # and fonts — see ui-shared.yaml
  shared_ui: !include ui-shared.yaml

  # Generic configuration for ESP32 screens
  # Get the time from HA
  time: !include esphome-modular-lvgl-buttons/common/time_homeassistant.yaml
  # Some basic sensors
  sensors: !include esphome-modular-lvgl-buttons/common/sensors_base_sdl.yaml

  # Hardware description file
  hardware: !include esphome-modular-lvgl-buttons/hardware/SDL-lvgl.yaml


# This is the main LVGL section. We start with a simple grid — matches my-panel.yaml's grid.
lvgl:
  pages:
    - id: main_page
      layout: 6x10
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml
      widgets:
        # You can use the package section above to add prebuilt button types or build your own custom button from scratch here.
        - container:
            id: button_12
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            grid_cell_row_pos: 5
            grid_cell_column_pos: 9
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            outline_width: 1   # debug code - This is for visualizing boundaries remove for production
            outline_color: red  # debug code - This is for visualizing boundaries remove for production
            widgets:
              - label:
                  text_font: $text_font
                  align: center
                  text_color: white
                  text: "Cell 5,9"
