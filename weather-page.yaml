---
# Dedicated full-screen weather page for the 1280x800 landscape screen
# (the 10.1" 800x1280 panel rotated 270°, and the SDL sim at the same size).
#
# Data comes from Home Assistant entity weather.forecast_home via the library's
# weather packages:
#   - ui/weather/today.yaml    — current conditions (temp, humidity, pressure,
#                                wind, visibility, condition icon)
#   - ui/weather/forecast.yaml — 4-day forecast via the weather.get_forecasts action
# Those packages update the widget IDs defined on the page below.

substitutions:
  # HA entity that reports a numeric Air Quality Index (US EPA scale) for the
  # AQI pill in the summary row. Easy sources: the WAQI or AirNow integrations
  # in HA, or your own PM2.5 sensor. The pill shows "--" until the entity
  # exists and reports a value. Override per-device in the device file's
  # top-level substitutions if needed.
  weather_aqi_entity: sensor.winnipeg_ellen_st_manitoba_canada_air_quality_index
  # Individual pollutant sensors from the same WAQI station (values are
  # WAQI individual-AQI index numbers, not µg/m³).
  weather_no2_entity: sensor.winnipeg_ellen_st_manitoba_canada_nitrogen_dioxide
  weather_o3_entity: sensor.winnipeg_ellen_st_manitoba_canada_ozone
  weather_so2_entity: sensor.winnipeg_ellen_st_manitoba_canada_sulphur_dioxide

  # ── Personal "ESP32 Air Quality" node (MQTT discovery → HA) ──────────────
  # HA prefixes MQTT-discovered entities with the device name ("ESP32 Air
  # Quality"), so the ids are sensor.esp32_air_quality_esp32_*. Verified in
  # HA Developer Tools → States. If you rename the entities in HA, update
  # them here.
  air_aqi_entity: sensor.esp32_air_quality_esp32_aqi
  air_pm1_entity: sensor.esp32_air_quality_esp32_pm1_0
  air_pm25_entity: sensor.esp32_air_quality_esp32_pm2_5
  air_pm10_entity: sensor.esp32_air_quality_esp32_pm10
  air_pm03_entity: sensor.esp32_air_quality_esp32_pm0_3_count
  air_co2_entity: sensor.esp32_air_quality_esp32_co2
  air_temp_entity: sensor.esp32_air_quality_esp32_temperature
  air_hum_entity: sensor.esp32_air_quality_esp32_humidity
  air_tvoc_entity: sensor.esp32_air_quality_esp32_tvoc
  air_h2_entity: sensor.esp32_air_quality_esp32_h2
  air_eth_entity: sensor.esp32_air_quality_esp32_ethanol

  # "Good" ranges for the node's readings. A value inside [lo, hi] renders
  # green, outside renders red, and the range is appended to the reading,
  # e.g. "3000ppm(0~1000)". Tune per room/preference.
  air_aqi_lo: "0"
  air_aqi_hi: "50"        # US EPA "Good" band
  air_pm1_lo: "0"
  air_pm1_hi: "10"        # ug/m3 — no official band, WHO-ish guideline
  air_pm25_lo: "0"
  air_pm25_hi: "12"       # ug/m3 — US EPA "Good" breakpoint
  air_pm10_lo: "0"
  air_pm10_hi: "54"       # ug/m3 — US EPA "Good" breakpoint
  air_pm03_lo: "0"
  air_pm03_hi: "1500"     # particles >0.3um per 0.1L, typical clean indoor air
  air_co2_lo: "0"
  air_co2_hi: "1000"      # ppm — fresh-air comfort threshold
  air_temp_lo: "18"
  air_temp_hi: "24"       # °C — indoor comfort
  air_hum_lo: "30"
  air_hum_hi: "60"        # % — indoor comfort
  air_tvoc_lo: "0"
  air_tvoc_hi: "220"      # ppb — UBA "good" boundary
  air_h2_lo: "12000"
  air_h2_hi: "14000"      # SGP30 raw ticks (higher = cleaner air); tune to your unit
  air_eth_lo: "17000"
  air_eth_hi: "20000"     # SGP30 raw ticks (higher = cleaner air); tune to your unit

packages:
  # Current weather + 200px condition icon
  weather_today_200: !include
    file: esphome-modular-lvgl-buttons/ui/weather/today.yaml
    vars:
      size: 200
      weather_entity: weather.forecast_home
      # No text summary sensor configured — replace with a real HA sensor
      # (e.g. a template/forecast summary sensor) to fill the summary row.
      weather_summary: sensor.none

  # 4-day forecast + 100px condition icons
  weather_forecast_100: !include
    file: esphome-modular-lvgl-buttons/ui/weather/forecast.yaml
    vars:
      size: 100
      weather_entity: weather.forecast_home

# Metric unit overrides — the library's today.yaml hardcodes "mph" and "mi",
# but HA (metric) sends wind in km/h and visibility in km. ESPHome appends
# these !extend handlers after the library's own on_value handlers, so the
# labels are rewritten with metric units on every update.
text_sensor:
  - id: !extend weather_wind_speed
    on_value:
      then:
        - lvgl.label.update:
            id: weather_wind_speed_today
            text: !lambda |-
              int speed = (int)(atof(x.c_str()) + 0.5);
              return str_sprintf("%d km/h", speed);

  - id: !extend weather_visibility
    on_value:
      then:
        - lvgl.label.update:
            id: weather_visibility_today
            text: !lambda |-
              return str_sprintf("%.0f km", atof(x.c_str()));

# Air quality pill — fed from a numeric AQI sensor in HA (see substitutions
# above). Reuses the library's aqi_pill_widget; the color-band logic matches
# ui/weather/aqi_pill.yaml, which we can't include directly because it is
# hardwired to the Pirate Weather module's update hook.
#
# The monitoring station publishes irregularly and often omits individual
# pollutants, which reaches ESPHome as NaN. Every handler below skips the
# update in that case, so the panel keeps showing the last real reading
# instead of blanking. Labels only read "--" before the first value arrives.
sensor:
  - platform: homeassistant
    id: weather_aqi
    entity_id: $weather_aqi_entity
    on_value:
      then:
        - script.execute: update_aqi_pill

  # Individual pollutants shown next to the AQI pill
  - platform: homeassistant
    id: weather_no2
    entity_id: $weather_no2_entity
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lvgl.label.update:
                  id: aqi_no2_value
                  text: !lambda 'return str_sprintf("%.0f", x);'

  - platform: homeassistant
    id: weather_o3
    entity_id: $weather_o3_entity
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lvgl.label.update:
                  id: aqi_o3_value
                  text: !lambda 'return str_sprintf("%.0f", x);'

  - platform: homeassistant
    id: weather_so2
    entity_id: $weather_so2_entity
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !isnan(x);'
            then:
              - lvgl.label.update:
                  id: aqi_so2_value
                  text: !lambda 'return str_sprintf("%.0f", x);'

  # ── Personal air-quality node readings ───────────────────────────────────
  # Each handler renders "value+unit(lo~hi)" and colors the label green when
  # the value is inside the good range, red when outside. NaN (entity missing
  # or unavailable) keeps the previous reading, same as the WAQI handlers.
  - platform: homeassistant
    id: air_aqi
    entity_id: $air_aqi_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_aqi_value),
                str_sprintf("%.0f(${air_aqi_lo}~${air_aqi_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_aqi_value),
                (x >= ${air_aqi_lo} && x <= ${air_aqi_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_pm1
    entity_id: $air_pm1_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_pm1_value),
                str_sprintf("%.0f(${air_pm1_lo}~${air_pm1_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_pm1_value),
                (x >= ${air_pm1_lo} && x <= ${air_pm1_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_pm25
    entity_id: $air_pm25_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_pm25_value),
                str_sprintf("%.0f(${air_pm25_lo}~${air_pm25_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_pm25_value),
                (x >= ${air_pm25_lo} && x <= ${air_pm25_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_pm10
    entity_id: $air_pm10_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_pm10_value),
                str_sprintf("%.0f(${air_pm10_lo}~${air_pm10_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_pm10_value),
                (x >= ${air_pm10_lo} && x <= ${air_pm10_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_pm03
    entity_id: $air_pm03_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_pm03_value),
                str_sprintf("%.0f(${air_pm03_lo}~${air_pm03_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_pm03_value),
                (x >= ${air_pm03_lo} && x <= ${air_pm03_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_co2
    entity_id: $air_co2_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_co2_value),
                str_sprintf("%.0fppm(${air_co2_lo}~${air_co2_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_co2_value),
                (x >= ${air_co2_lo} && x <= ${air_co2_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_temp
    entity_id: $air_temp_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            // The node publishes °F, but HA converts to °C if the entity's
            // display unit was changed. Room temperature never exceeds 45 in
            // °C, so treat anything higher as °F and convert.
            float c = (x > 45.0f) ? (x - 32.0f) * 5.0f / 9.0f : x;
            lv_label_set_text(id(air_temp_value),
                str_sprintf("%.1f°C(${air_temp_lo}~${air_temp_hi})", c).c_str());
            lv_obj_set_style_text_color(id(air_temp_value),
                (c >= ${air_temp_lo} && c <= ${air_temp_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_hum
    entity_id: $air_hum_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_hum_value),
                str_sprintf("%.0f%%(${air_hum_lo}~${air_hum_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_hum_value),
                (x >= ${air_hum_lo} && x <= ${air_hum_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_tvoc
    entity_id: $air_tvoc_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_tvoc_value),
                str_sprintf("%.0fppb(${air_tvoc_lo}~${air_tvoc_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_tvoc_value),
                (x >= ${air_tvoc_lo} && x <= ${air_tvoc_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_h2
    entity_id: $air_h2_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_h2_value),
                str_sprintf("%.0f(${air_h2_lo}~${air_h2_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_h2_value),
                (x >= ${air_h2_lo} && x <= ${air_h2_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

  - platform: homeassistant
    id: air_eth
    entity_id: $air_eth_entity
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            lv_label_set_text(id(air_eth_value),
                str_sprintf("%.0f(${air_eth_lo}~${air_eth_hi})", x).c_str());
            lv_obj_set_style_text_color(id(air_eth_value),
                (x >= ${air_eth_lo} && x <= ${air_eth_hi})
                    ? lv_color_hex(0x00E400) : lv_color_hex(0xFF4444),
                LV_PART_MAIN);

script:
  # Corner date+time on the weather page. `time_update` lives in ui-shared.yaml
  # and is fired by backlight_time.yaml on every time sync and once a minute,
  # so this rides along with the clock/calendar page's own !extend.
  - id: !extend time_update
    then:
      - lambda: |-
          auto now = id(system_time).now();
          if (!now.is_valid()) return;
          // Day appended separately: %e space-pads and %d zero-pads, so
          // neither looks right for single-digit days (same trick as
          // clock-calendar.yaml).
          lv_label_set_text(id(weather_datetime),
              str_sprintf("%s %d  %02d:%02d", now.strftime("%a %b").c_str(),
                          now.day_of_month, now.hour, now.minute).c_str());

  - id: update_aqi_pill
    then:
      - lambda: |-
          // Station reported nothing this cycle — leave the pill showing the
          // last good reading rather than blanking it.
          if (isnan(id(weather_aqi).state)) return;

          // US EPA AQI color bands (bg) with a readable text color.
          int aqi = (int) lroundf(id(weather_aqi).state);
          char buf[8];
          snprintf(buf, sizeof(buf), "%d", aqi);
          lv_label_set_text(id(aqi_pill_label), buf);
          lv_color_t bg;
          lv_color_t fg = lv_color_white();
          if (aqi <= 50)       { bg = lv_color_hex(0x00E400); fg = lv_color_black(); } // Good
          else if (aqi <= 100) { bg = lv_color_hex(0xFFFF00); fg = lv_color_black(); } // Moderate
          else if (aqi <= 150) { bg = lv_color_hex(0xFF7E00); fg = lv_color_black(); } // Unhealthy (sensitive)
          else if (aqi <= 200) { bg = lv_color_hex(0xFF0000); }              // Unhealthy
          else if (aqi <= 300) { bg = lv_color_hex(0x8F3F97); }              // Very Unhealthy
          else                 { bg = lv_color_hex(0x7E0023); }              // Hazardous
          lv_obj_set_style_bg_color(id(aqi_pill), bg, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(aqi_pill_title), fg, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(aqi_pill_label), fg, LV_PART_MAIN);

# Styles for the weather page
.weather_page_styles:
  # A tile on the 4x4 grid: dark rounded card, contents stacked and centered
  - &weather_cell
    grid_cell_x_align: stretch
    grid_cell_y_align: stretch
    bg_color: very_dark_gray
    bg_opa: cover
    radius: 6
    pad_all: 4
    scrollbar_mode: "OFF"
    layout:
      type: flex
      flex_flow: COLUMN
      flex_align_main: center
      flex_align_cross: center
      flex_align_track: center
      pad_row: 4

  # Small gray caption above a value
  - &weather_caption
    height: SIZE_CONTENT
    text_font: nunito_20
    text_color: $label_off_color

  # A value label
  - &weather_value
    height: SIZE_CONTENT
    text_color: $label_on_color

  # A caption+value pair in the AQI row (transparent, content-sized)
  - &aqi_stat_cell
    width: SIZE_CONTENT
    height: SIZE_CONTENT
    bg_opa: TRANSP
    border_width: 0
    pad_all: 0
    scrollbar_mode: "OFF"
    layout:
      type: flex
      flex_flow: COLUMN
      flex_align_cross: center
      pad_row: 2

  # One horizontal line inside the air-quality card (transparent, centered)
  - &air_stat_row
    width: 100%
    height: SIZE_CONTENT
    bg_opa: TRANSP
    border_width: 0
    pad_all: 0
    scrollbar_mode: "OFF"
    layout:
      type: flex
      flex_flow: ROW
      flex_align_main: center
      flex_align_cross: center
      pad_column: 28

  # Forecast card labels
  - &forecast_label
    height: SIZE_CONTENT
    text_font: nunito_24
    text_color: $label_on_color

lvgl:
  pages:
    - id: weather_page
      # Explicit grid instead of the 4x4 shorthand: the forecast row (FR 29)
      # gets extra height so the blue low-temperature labels aren't clipped,
      # the air-quality row (FR 29) holds three lines of readings, and
      # pad_bottom keeps the cards off the screen edge.
      layout:
        type: grid
        grid_rows: [FR(21), FR(21), FR(29), FR(29)]
        grid_columns: [FR(1), FR(1), FR(1), FR(1)]
      pad_bottom: 14
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml
      widgets:

        # ── Row 0-1, left: current temperature + humidity ────────────────
        - obj:
            <<: *weather_cell
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            widgets:
              - label:
                  <<: *weather_value
                  id: weather_temperature_today
                  text_font: nunito_72
                  text: "---°"

        - obj:
            <<: *weather_cell
            grid_cell_row_pos: 0
            grid_cell_column_pos: 1
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            widgets:
              - label:
                  <<: *weather_caption
                  text: "Humidity"
              - label:
                  <<: *weather_value
                  id: weather_humidity_today
                  text_font: nunito_48
                  text: "---%"

        # ── Row 1, left: wind / pressure / visibility ────────────────────
        - obj:
            <<: *weather_cell
            grid_cell_row_pos: 1
            grid_cell_column_pos: 0
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            widgets:
              - label:
                  <<: *weather_caption
                  text: "Wind"
              - label:
                  <<: *weather_value
                  id: weather_wind_speed_today
                  text_font: nunito_36
                  text: "---"
              - label:
                  <<: *weather_value
                  id: weather_wind_dir_today
                  text_font: nunito_24
                  text: "---"

        - obj:
            <<: *weather_cell
            grid_cell_row_pos: 1
            grid_cell_column_pos: 1
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            widgets:
              - label:
                  <<: *weather_caption
                  text: "Pressure"
              - label:
                  <<: *weather_value
                  id: weather_pressure_today
                  text_font: nunito_24
                  text: "--- hPa"
              - label:
                  <<: *weather_caption
                  text: "Visibility"
              - label:
                  <<: *weather_value
                  id: weather_visibility_today
                  text_font: nunito_24
                  text: "---"

        # ── Rows 0-1, right: big current condition icon ──────────────────
        - obj:
            <<: *weather_cell
            grid_cell_row_pos: 0
            grid_cell_column_pos: 2
            grid_cell_row_span: 2
            grid_cell_column_span: 2
            widgets:
              # Short date + time tucked into the card's top-right corner.
              # `ignore_layout` pulls it out of the flex COLUMN flow so the
              # condition icon stays centred in the cell as before.
              - label:
                  id: weather_datetime
                  ignore_layout: true
                  align: TOP_RIGHT
                  x: -6
                  y: 6
                  text_font: nunito_24
                  text_color: amber
                  text: "--- --- --  --:--"
              - image:
                  src: unknown_200
                  id: weather_condition_icon

        # ── Row 2: air quality, three lines ──────────────────────────────
        # Line 1: WAQI internet station — AQI pill + pollutant indices.
        # Lines 2-3: the personal "ESP32 Air Quality" MQTT node. Each value
        # shows its good range and is colored by the on_value handlers above
        # (green = inside range, red = outside).
        - obj:
            <<: *weather_cell
            grid_cell_row_pos: 2
            grid_cell_column_pos: 0
            grid_cell_row_span: 1
            grid_cell_column_span: 4
            pad_all: 8
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: space_evenly
              flex_align_cross: center
              pad_row: 2
            widgets:
              # Line 1 — internet station (unchanged behavior)
              - obj:
                  <<: *air_stat_row
                  widgets:
                    - !include
                        file: esphome-modular-lvgl-buttons/ui/weather/aqi_pill_widget.yaml
                        vars:
                          aqi_label_font: nunito_20
                          aqi_value_font: nunito_36
                    - obj:
                        <<: *aqi_stat_cell
                        widgets:
                          - label:
                              <<: *weather_caption
                              text: "NO2"
                          - label:
                              <<: *weather_value
                              id: aqi_no2_value
                              text_font: nunito_36
                              text: "--"
                    - obj:
                        <<: *aqi_stat_cell
                        widgets:
                          - label:
                              <<: *weather_caption
                              text: "O3"
                          - label:
                              <<: *weather_value
                              id: aqi_o3_value
                              text_font: nunito_36
                              text: "--"
                    - obj:
                        <<: *aqi_stat_cell
                        widgets:
                          - label:
                              <<: *weather_caption
                              text: "SO2"
                          - label:
                              <<: *weather_value
                              id: aqi_so2_value
                              text_font: nunito_36
                              text: "--"
                    # Text summary — no summary sensor is configured (see the
                    # weather_summary var above), so this stays hidden. If you
                    # add a real summary sensor, remove `hidden` and give this
                    # label `flex_grow: 1` (and switch flex_align_main to start).
                    - label:
                        id: weather_summary_today
                        hidden: true
                        text: ""
                        text_font: nunito_24
                        text_color: $label_on_color
                        text_align: LEFT

              # Line 2 — personal node: AQI + particulates + CO2
              - obj:
                  <<: *air_stat_row
                  widgets:
                    - obj:
                        <<: *aqi_stat_cell
                        widgets:
                          - label:
                              <<: *weather_caption
                              text: "AQI"
                          - label:
                              <<: *weather_value
                              id: air_aqi_value
                              text_font: nunito_24
                              text: "--"
                    - obj:
                        <<: *aqi_stat_cell
                        widgets:
                          - label:
                              <<: *weather_caption
                              text: "PM1"
                          - label:
                              <<: *weather_value
                              id: air_pm1_value
