---
# LD2410 mmWave presence sensor on a YD-ESP32-S3 (VCC-GND) dev board.
#
# Board is the "N16R8" variant: 16 MB flash + 8 MB octal PSRAM. There is no
# dedicated PlatformIO board for it, so we use esp32-s3-devkitc-1 (same
# pinout) and override the flash size explicitly — the devkitc-1 default is
# 8 MB and flashing with that would work but waste half the chip.
#
# Wiring:
#   LD2410 TX -> GPIO17 (rx_pin), LD2410 RX -> GPIO18 (tx_pin)
#   LED strip enable line (MOSFET/relay) on GPIO16
#   Onboard WS2812 RGB LED on GPIO48 (close the "RGB" solder jumper if open)
#
# Cable routing is not optional here. The strip's switching currents couple
# into the radar's front end through the near field, and coiling the strip
# wiring around the sensor saturated every gate at 100% energy — the radar
# stopped resolving range entirely and tripped on anything. Straightening the
# run to ~10 cm clear of the module dropped the idle floor to ~5%. Keep the
# strip leads straight, away from the module, and never looped around it.

esphome:
  name: "led-sensor"
  friendly_name: "LED Presence Sensor"
  comment: "YD-ESP32-S3 N16R8 with LD2410 mmWave radar"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# N16R8 = octal PSRAM. Not required for this config, but declaring it makes
# the 8 MB available if fonts/images/voice get added later.
psram:
  mode: octal
  speed: 80MHz

logger:
  # Uncomment to dump every raw radar frame as hex. Frames are only logged
  # after the header/footer check passes, so anything that appears here is
  # well-formed data straight off the UART — useful for telling "the radar
  # really is reporting this" apart from "we are misparsing the stream".
  # level: VERBOSE
  # logs:
  #   ld2410: VERBOSE

api:

ota:
  - platform: esphome

packages:
  # Wi-Fi credentials from secrets.yaml, plus captive portal and web server.
  wifi: !include esphome-modular-lvgl-buttons/common/wifi.yaml

uart:
  tx_pin: GPIO18
  rx_pin: GPIO17
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:

# LED strip enable line on GPIO16 (via MOSFET/relay — plain on/off output).
switch:
  - platform: gpio
    pin: GPIO16
    id: car_strip
    name: "Accent strip"

  # Engineering mode makes the radar stream per-gate energy (the gN sensors
  # further down). Turn it on from HA while tuning thresholds, off afterwards
  # — it roughly doubles the UART traffic for no benefit in normal use.
  - platform: ld2410
    engineering_mode:
      name: "Engineering Mode"

# Strip stays on for 30 s after the room clears. mode: restart means a fresh
# release restarts the countdown, and on_press cancels it entirely — without
# this, leaving and returning within 30 s would cut the strip off mid-stay.
#
# Three timers stack on the off path: the radar's own absence delay (the
# "Presence Timeout" number, default 5 s) + the delayed_off filter + this
# script. Keep the filter short and do the holding here, or the strip lingers
# for over a minute.
script:
  - id: strip_off_delayed
    mode: restart
    then:
      - delay: 30s
      - switch.turn_off: car_strip

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
      id: presence
      # Wind-driven foliage gives short, jittery hits. delayed_on: 2s means
      # the radar has to stay tripped for 2 s straight before we believe it,
      # which kills isolated gusts. delayed_off is only a debounce here (5 s);
      # the real hold is strip_off_delayed below — see the note on stacking.
      filters:
        - delayed_on: 2s
        - delayed_off: 5s
      # Drive the onboard LED and accent strip from presence directly
      # on-device, so it works even with HA offline.
      on_press:
        - script.stop: strip_off_delayed
        - switch.turn_on: car_strip
        - light.turn_on:
            id: onboard_led
            brightness: 40%
            red: 0%
            green: 0%
            blue: 40%
      on_release:
        - script.execute: strip_off_delayed
        - light.turn_off: onboard_led
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

sensor:
  - platform: ld2410
    detection_distance:
      name: "Detection Distance"
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    # Only populated while Engineering Mode is on. These are the numbers you
    # tune against: park in front of the sensor with the leaves moving and
    # nobody present, note the peak energy per gate, then set that gate's
    # threshold above it. g0/g1 cover roughly the first 1.5 m at the default
    # 0.75 m resolution, so 40 cm foliage shows up there.
    g0:
      move_energy:
        name: "G0 Move Energy"
        filters:
          - throttle: 1s
      still_energy:
        name: "G0 Still Energy"
        filters:
          - throttle: 1s
    g1:
      move_energy:
        name: "G1 Move Energy"
        filters:
          - throttle: 1s
      still_energy:
        name: "G1 Still Energy"
        filters:
          - throttle: 1s
    g2:
      move_energy:
        name: "G2 Move Energy"
        filters:
          - throttle: 1s
      still_energy:
        name: "G2 Still Energy"
        filters:
          - throttle: 1s
    g3:
      move_energy:
        name: "G3 Move Energy"
        filters:
          - throttle: 1s
      still_energy:
        name: "G3 Still Energy"
        filters:
          - throttle: 1s
    g4:
      move_energy:
        name: "G4 Move Energy"
        filters:
          - throttle: 1s
      still_energy:
        name: "G4 Still Energy"
        filters:
          - throttle: 1s

# Factory Reset restores the radar's own factory thresholds and gate settings,
# which is the reliable way out of a botched calibration — the module knows its
# defaults, so there is nothing to retype. The component sends the reset, then
# restarts the module and re-reads every parameter, so the HA sliders refresh
# to the restored values on their own (ld2410.cpp:674).
#
# Query Params re-reads the module's current settings without changing them —
# useful when you want to confirm what is actually stored in radar flash rather
# than what HA last showed.
button:
  - platform: ld2410
    factory_reset:
      name: "Factory Reset"
    restart:
      name: "Radar Restart"
    query_params:
      name: "Query Params"

# Radar firmware version — distance_resolution below needs LD2410 firmware
# 2.04 or newer; check this entity in HA if the select has no effect.
text_sensor:
  - platform: ld2410
    version:
      name: "Radar Firmware"

# Gate resolution: 0.75m (default, ~6 m range) or 0.2m (~1.8 m range).
# Stored in the radar module's own flash, so it survives ESP reboots.
select:
  - platform: ld2410
    distance_resolution:
      name: "Distance Resolution"

# Coverage tuning. Since ESPHome 2023.4 these are number entities (sliders in
# HA) rather than fixed YAML keys. Values are written to the radar module's
# flash, so set them once from HA and they persist.
#   max_*_distance_gate: last gate that counts (0-8), i.e. detection range.
#   timeout: how long presence is held after the last detection.
#   gN thresholds (0-100): energy needed for that gate to trigger; higher =
#   less sensitive. still_threshold 0 disables still detection for the gate.
#
# Near-field false triggers (leaves/wind at ~40 cm) live in g0/g1. The radar
# will not let you set max_move_distance_gate below 2, so you cannot range
# them out — raise their thresholds instead. Starting point for outdoor-ish
# mounting: g0/g1 move_threshold 80-100, still_threshold 0 (a swaying branch
# reads as "still" the moment it pauses between gusts). Then walk the area
# and drop them back down until people register reliably again.
number:
  - platform: ld2410
    max_move_distance_gate:
      name: "Max Move Gate"
    max_still_distance_gate:
      name: "Max Still Gate"
    timeout:
      name: "Presence Timeout"
    g0:
      move_threshold:
        name: "G0 Move Threshold"
      still_threshold:
        name: "G0 Still Threshold"
    g1:
      move_threshold:
        name: "G1 Move Threshold"
      still_threshold:
        name: "G1 Still Threshold"
    g2:
      move_threshold:
        name: "G2 Move Threshold"
      still_threshold:
        name: "G2 Still Threshold"
    g3:
      move_threshold:
        name: "G3 Move Threshold"
      still_threshold:
        name: "G3 Still Threshold"
    g4:
      move_threshold:
        name: "G4 Move Threshold"
      still_threshold:
        name: "G4 Still Threshold"
    g5:
      move_threshold:
        name: "G5 Move Threshold"
      still_threshold:
        name: "G5 Still Threshold"
    g6:
      move_threshold:
        name: "G6 Move Threshold"
      still_threshold:
        name: "G6 Still Threshold"
    g7:
      move_threshold:
        name: "G7 Move Threshold"
      still_threshold:
        name: "G7 Still Threshold"
    g8:
      move_threshold:
        name: "G8 Move Threshold"
      still_threshold:
        name: "G8 Still Threshold"

# Onboard WS2812 on GPIO48 — lit green by the Presence sensor above, and
# still controllable from HA as a normal light.
light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    name: "Onboard LED"
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
