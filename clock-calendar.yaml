                              <<: *cal_header
                              grid_cell_row_pos: 0
                              grid_cell_column_pos: 5
                              text: "Fr"
                          - label:
                              <<: *cal_header
                              grid_cell_row_pos: 0
                              grid_cell_column_pos: 6
